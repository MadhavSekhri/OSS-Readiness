[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-readiness"
version = "0.1.0"
description = "Audit local repository contributor-readiness documentation and project hygiene"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Open-source contributors"}]
dependencies = []

[project.scripts]
oss-readiness = "oss_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
